name: Render Backend Keep-Alive

on:
  schedule:
    # Run every 14 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://gridbricks-assignment.onrender.com' }}
        run: |
          echo "Pinging health endpoint at: ${RENDER_URL}/api/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${RENDER_URL}/api/health" || echo "000")
          echo "Response HTTP Status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 400 ]; then
            echo "Render backend is awake and responding!"
          else
            echo "Wake-up signal transmitted (HTTP: ${HTTP_STATUS})."
          fi
